<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<button command = "show-modal" commandfor="form-dialog">Add New Book</button>

<dialog id="form-dialog">
    <form action="#" id="form">
        <fieldset><legend>Enter Book Details </legend> 
        <div>
        <label for="name">Authors Name</label>
        <input type="text" id="name" required  name="name" placeholder="eg: Robert Greene">
        </div>
       
         <div>
        <label for="title">Book Title</label>
        <input type="text" id="title" required  name="title" placeholder="eg:48 Laws of power">
        </div>
       
         <div>
        <label for="pages">Number of Pages</label>
        <input type="text" id="pages" min="10"  step="1"  required name="name" placeholder="eg: 200">
        </div>

        <div class="read">
        <label for="status">Finished reading</label>
        <input type="checkbox" id="status">
         </div>


        <div>
            <button id="add">Add Book</button>
        </div>
       </fieldset>
    </form>

    <button command = "close" commandfor="form-dialog">Close Form</button>
    </dialog>


    <main id="container">

    </main>

    <script src="index.js"></script>
</body>
</html>
